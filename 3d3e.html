<!DOCTYPE html>
<html>
    <head>
        <style>
.get_started_button{
    background-color: rgb(121, 82, 179);
    color: white;
    height: 45px;
    width: 125px;
    border-radius: 4px;
    border: none;
    font-weight: bold;
    font-size: 15px;
    margin-right: 4px;
    cursor: pointer;
    transition: background-color 1s;
}
.get_started_button:hover{
    background-color: white;
    color: rgb(121, 82, 179);
    border-color: rgb(121, 82, 179);
    border:solid;
    border-width: 1px;
}
.get_started_button:active{
    opacity: 0.6;
}

.download_button{
    background-color: white;
    color: rgb(108, 117, 125);
    border:rgb(108, 117, 125) ;
    border-style: solid;
    border-width: 1px;
    height: 45px;
    width: 125px;
    border-radius: 4px;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;  
    transition: background-color 1s; 
}
.download_button:hover{
    background-color:rgb(108, 117, 125);
    color: white;
}
.download_button:active{
    opacity: 0.6;
}
    .website_button{
        background-color: rgb(10, 102, 194);
        color: white;
        height: 40px;
        width: 260px;
        border: none;
        border-radius: 25px;
        font-weight: bold;
        font-size: 16px;
        margin-right: 4px;
        cursor: pointer;
      transition: background-color 1s;
    }
    .website_button:hover{
        background-color: white;
        color: rgb(10, 102, 194);
        border: solid;
        border-color: rgb(10, 102, 194);
        border-width: 2px;
    }
    .website_button:active{
        opacity: 0.6;
    }
    .save_button{
        background-color: white;
        color: rgb(10, 102, 194);
        height: 40px;
        width: 100px;
        border-color: rgb(10, 102, 194);
        border-style: solid;
        border-radius: 25px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: background-color 1s;
    }
    .save_button:hover{
        background-color: rgb(10, 102, 194);
        color: white;
    }
    .save_button:active{
        opacity: 0.6;
    }
</style>
    </head>
    <body>
        
<button class="website_button">Apply on company website</button>
<button class="save_button">Save</button><br><br>
<button class="get_started_button">Get started</button>
<button class="download_button">Download</button>
    </body>
</html>
