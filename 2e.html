<!DOCTYPE html>
<html>
    <head>
        <style>
    .website_button{
        background-color: rgb(10, 102, 194);
        color: white;
        height: 40px;
        width: 260px;
        border: none;
        border-radius: 25px;
        font-weight: bold;
        font-size: 16px;
        margin-right: 4px;
        cursor: pointer;

    }
    .save_button{
        background-color: white;
        color: rgb(10, 102, 194);
        height: 40px;
        width: 100px;
        border-color: rgb(10, 102, 194);
        border-style: solid;
        border-radius: 25px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;

    }
</style>
    </head>
    <body>
        <button class="website_button">Apply on company website</button>
<button class="save_button">Save</button>
    </body>
</html>
