<!DOCTYPE html>
<html>
<head>
    <style>
        .container {
            display: flex;
            width: 500px;
            height: 80px;
        }

        .item1 {
            background-color: lightpink;
            width: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .item2 {
            background-color: lightblue;
            flex: 1;
        }

        .item1 p {
            background-color: black;
            color: white;
            margin: 0;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="item1">
            <p>item1</p>
        </div>

        <div class="item2"></div>
    </div>

</body>
</html>
