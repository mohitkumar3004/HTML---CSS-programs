<!DOCTYPE html>
<html>
    <head>
        <style>
    .shadow_button{
        background-color: green;
        color: white;
        padding-top: 5px;
        padding-right: 5px;
        padding-left: 5px;
        padding-bottom: 5px;
        border: none;
        transition: box_shadow 1s;
    }
    .shadow_button:hover{
        box-shadow: 4px 4px 7px rgba(0 ,0 ,0 ,0.15);
    }
    .shadow_button:active{
        opacity: 0.6;
    }

</style>
    </head>
    <body>
        <button class="shadow_button">Shadow</button>
    </body>
</html>
