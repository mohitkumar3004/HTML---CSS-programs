<!DOCTYPE html>
<html>
    <head>
        <style>
    .add_to_cart_button{
        background-color: rgb(255, 216, 20);
        color: black;
        height: 40px;
        width: 250px;
        border: none;
        border-radius: 25px;
        font-size: 20px;
        margin-right: 4px;
        cursor: pointer;
    }
    .sign_up_button{
        background-color: rgb(46, 164, 79);
        color: white;
        height: 40px;
        width: 100px;
        border: none;
        border-radius: 8px;
        font-weight: bold;
        font-size: 16px;
        cursor: pointer;
    }
</style>
    </head>
    <body>
        <button class="add_to_cart_button">Add to Cart</button>
<button class="sign_up_button">Sign up</button>
    </body>
</html>
