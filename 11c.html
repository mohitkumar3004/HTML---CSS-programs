<!DOCTYPE html>
<html>
    <head>
<style>
    .grid-example{
        display: grid;
        grid-template-columns: 1fr 1fr 1fr 1fr;
        column-gap: 10px;
        row-gap: 0px;
    }
    .p1,.p3{
        background-color: lightpink;
        color: black;
    }
    .p2,.p4{
        background-color: lightpink;
        color: black;
    }
</style>
    </head>
    <body>
        <div class="grid-example">
        <p class="p1">col1</p>
        <p class="p2">col2</p>
        <p class="p3">col3</p>
        <p class="p4">col4</p>
        <p class="p1">col1</p>
        <p class="p2">col2</p>
        <p class="p3">col3</p>
        <p class="p4">col4</p>
        </div>
    </body>
</html>
