<!DOCTYPE html>
<html>
    <head>
        <style>
    .request_button{
        background-color: black;
        color: white;
        padding-top: 10px;
        padding-bottom: 10px;
        padding-left: 10px;
        padding-right: 10px;
        border: none;
        margin-left: 4px;
        cursor: pointer;
        margin-right: 8px;
    }
    .request_button:hover{
        opacity: 0.7;
    }
    .request_button:active{
        opacity: 0.6;
    }
    .add_to_cart_button{
        background-color: rgb(255, 216, 20);
        color: black;
        padding-top: 10px;
        padding-bottom: 10px;
        padding-left: 40px;
        padding-right: 40px;
        border: none;
        border-radius: 25px;
        font-size: 20px;
        margin-right: 8px;
        cursor: pointer;
        transition: background-color 1s;
    }
    .add_to_cart_button:hover{
        background-color:black ;
        color: rgb(255, 216, 20);
    }
    .add_to_cart_button:active{
        opacity: 0.6;
    }
    .sign_up_button{
        background-color: rgb(46, 164, 79);
        color: white;
        padding-top: 10px;
        padding-bottom: 10px;
        padding-left: 10px;
        padding-right: 10px;
        border: none;
        border-radius: 8px;
        font-weight: bold;
        font-size: 16px;
        cursor: pointer;
        transition: hover 1s;
    }
    .sign_up_button:hover{
        box-shadow: 4px 5px 4px rgba(0,0,0,0.15);
    }
    .sign_up_button:active{
        opacity: 0.6;
    }
</style>
    </head>
    <body>
        <button class="add_to_cart_button">Add to Cart</button>
<button class="sign_up_button">Sign up</button>
<button class="request_button">Request now</button>
    </body>
</html>
