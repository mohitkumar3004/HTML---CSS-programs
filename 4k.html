<!DOCTYPE html>
<html>
    <head>
        <style>
    .bt{
        background-color: green;
        color: white;
        border: none;
        padding-top: 5px;
        padding-bottom: 5px;
        padding-left: 10px;
        padding-right: 10px;
        margin-left: 4px;
        margin-right: 4px;
        transition: padding 0.15s;
    }
    .bt:hover{
        padding-left:15px;
        padding-right: 15px;
    }
    .bt:active{
        opacity: 0.6;
    }
</style>
    </head>
    <body>
        <button class="bt">One</button>
<button class="bt">Two</button>
<button class="bt">Three</button>
    </body>
</html>
