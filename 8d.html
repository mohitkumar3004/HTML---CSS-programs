<!DOCTYPE html>
<html>
<head>
<style>
    .c1, .c2, .c3 {
        font-size: 14px;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid gray;
        box-sizing: border-box;
        margin-bottom: 10px;
    }

    .c1, .c2 {
        display:inline;
        width: 138px;
    }

    .c3 {
        display: block;
        width: 280px;
    }

    .sign_up_button {
        background-color: rgb(0, 132, 255);
        color: white;
        border: none;
        border-radius: 8px;
        width: 280px;
        padding: 10px;
        font-weight: bold;
    }
    .center_form{
        margin: auto;
        width: 280px;
    }
</style>
</head>

<body>
    <div class="center_form">
    <input class="c1" type="text" placeholder="First name">
    <input class="c2" type="text" placeholder="Last name">

    <input class="c3" type="text" placeholder="Email">

    <button class="sign_up_button">Sign Up</button>
    </div>
</body>
</html>
