<!DOCTYPE html>
<html>
    <head>
<style>
    .grid-example{
        display: grid;
        grid-template-columns: 50px 75px 50px;
    }
    .p1,.p3{
        background-color: lightblue;
        color: black;
    }
    .p2{
        background-color: lightpink;
        color: black;
    }
</style>
    </head>
    <body>
        <div class="grid-example">
        <p class="p1">col1</p>
        <p class="p2">col2</p>
        <p class="p3">col3</p>
        </div>
    </body>
</html>
