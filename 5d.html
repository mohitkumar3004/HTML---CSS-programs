<!DOCTYPE html>
<html>
    <head>
        <style>
    .p1{
        font-family: verdana;
        font-size: 24px;
        font-weight: bold;
        margin-bottom: 5px;
    }
    .p2{
        font-family: verdana;
        font-size: 21px;
        color: rgb(114, 114, 114);
        margin-top: 0px;
    }
    .p3{
        font-family: verdana;
        font-size: 20px;
        width:350px;
    }
    .get_started_button{
        background-color: green;
        color: white;
        border: none;
        font-size: 20px;
        border-radius: 8px;
        padding-top: 10px;
        padding-bottom: 10px;
        padding-left: 20px;
        padding-right: 20px ;
        transition: background-colour 1s;
    }
    .get_started_button:hover{
        background-color: white;
        color: green;
        border-color: green;
        border-width: 1px;
        border-style: solid;
    }
    .get_started_button:active{
        opacity: 0.7;
    }
</style>
    </head>
    <body>
        <p class="p1">HTML CSS Course</p>
<p class="p2">Beginner to Pro</p>
<p class="p3">In this course, we'll learn the skills you need to become a developer.</p>
<button class="get_started_button">Get Started</button>

    </body>
</html>
