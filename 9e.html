<!DOCTYPE html>
<html>
    <head>
        <style>
            .img1{
                width:60px;
                border-radius: 100%;
                margin-left: 20px;
                display: inline-block;
            }
            .p1{
                color:grey;
                font-family: arial;
                font-size:20px;
                display:inline-block;
                margin-left: 20px;
                width:190px;

            }
            .b1{
                background-color: rgb(0, 140, 255);
                color:white;
                border:none;
                font-size: 16px;
                font-family: arial;
                font-weight: bold;
                border-radius: 20px;
                padding-top: 10px;
                padding-bottom: 10px;
                padding-left:15px;
                padding-right: 15px;
                margin-left: 100px;
                transition: background-color 1s;
                cursor: pointer;
            }
            .b1:hover{
                background-color: white;
                border:solid;
                color: rgb(0, 140, 255);
                border-width: 1px;
                opacity:0.7;
            }
            .b1:active{
                opacity:0.5;
            }
            .d1{
                border:none;
                border-width: 1px;
                box-shadow: 0 4px 10px 4px rgba(155, 151, 151, 2);
                width: 500px;
                border-radius: 16px;
                margin:auto;
                display: block;}
        </style>
    </head>
    <body><div class="d1">
        <img class="img1"src="catimage.jpg">
        <p class="p1">What's happening?</p>
        <button class="b1">Tweet</button></div>
    </body>
</html>
