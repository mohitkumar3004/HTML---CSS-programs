<!DOCTYPE html>
<html>
    <head>
        <style>
    .p1{
        font-family: arial;
        font-weight: bold;
        font-size: 21px;
        text-align: center;
        margin-bottom: 10px;
    }
    .p2{
        font-family: arial;
        font-size:12px;
        text-align: center;
        margin-bottom: 0px;
    }
    .p3{
        color: blue;
        font-family: arial;
        font-size: 12px;
        text-align: center;
        cursor: pointer;
    }
    .p3:hover{
        opacity: 0.7;
    }
    .p3:active{
        opacity:0.5;
    }
</style>
    </head>
    <body>
        <p class="p1">Shopping for your business?</p>
        <p class="p2">See how Apple at Work can help.</p>
        <p class="p3">Learn more &gt;</p>
    </body>
</html>
